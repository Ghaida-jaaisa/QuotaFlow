# Quick start:  cp .env.example .env   (set POSTGRES_PASSWORD)   then   docker compose up --build
name: quotaflow

x-database-url: &database-url postgres://${POSTGRES_USER:-quotaflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}@postgres:5432/${POSTGRES_DB:-quotaflow}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-quotaflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: lets host-side tests and psql connect without exposing the DB on the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: applies migrations and seeds predefined plans, then exits.
  # Idempotent, so it runs safely on every `docker compose up`.
  migrate:
    build: *api-build
    image: quotaflow-api:local
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: quotaflow-api:local
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Load tests (not started by default):
  #   docker compose --profile loadtest run --rm k6 run /scripts/scenario-a-normal.js
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    volumes:
      - ./load-tests:/scripts
    environment:
      BASE_URL: http://api:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
